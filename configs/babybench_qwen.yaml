model:
  name: Qwen/Qwen2.5-0.5B-Instruct
  device: auto
  dtype: float16

decode:
  max_new_tokens: 256
  temperature: 0.7
  top_p: 0.95
  num_candidates: 5
  greedy: false

grammar:
  schema_path: agplan/grammars/babyai_plan.ebnf
  format: ebnf

priors:
  pcfg:
    enabled: false
    lambda: 0.5
    alpha: 0.1
  adaptor:
    enabled: false
    lambda: 0.5
    discount: 0.5
    strength: 1.0
    min_fragment_len: 2
    max_fragment_len: 6

verifier:
  benchmark: babybench
  task_set: train

logging:
  jsonl_path: outputs/{run_id}.jsonl

seed: 0
